  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:48rem;margin:2rem auto;padding:0 1.25rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Test Image Generator — just image things</h1>
        <p>
          Synthesize deterministic test and fixture images locally in your browser with WebAssembly. Nothing is
          uploaded.
        </p>
        <p><strong>JavaScript and WebAssembly are required to run the interactive generator.</strong></p>
        <h2>Generator Options</h2>
        <ul>
          <li><strong>Dimensions:</strong> 1 to 8,192 px per side (40 MP max), with presets for 512×512, 1280×720, 1920×1080, and 3840×2160.</li>
          <li><strong>Colour complexity (0–100) &amp; seed:</strong> Flat, Gradient, Shapes, Detailed, or Noise with a deterministic seed.</li>
          <li><strong>Output formats:</strong> WebP, AVIF, JPEG, PNG, JPEG XL, GIF, TIFF, BMP, ICO, and QOI (with lossless mode for WebP, AVIF, and JPEG XL).</li>
          <li><strong>Target file size:</strong> Optional KB/MB target (e.g. 100 KB, 500 KB, 1 MB, 5 MB) searched automatically to land within ±10%.</li>
        </ul>

        </p>
