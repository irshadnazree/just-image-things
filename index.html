      <main style="max-width:48rem;margin:2rem auto;padding:0 1.25rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>just image things — Local Batch Image Converter, Compressor &amp; Resizer</h1>
        <p>
          Batch convert, compress, resize, and rename images or entire folders directly in your browser using
          WebAssembly. Everything runs locally on your device — nothing is ever uploaded.
        </p>
        <p><strong>JavaScript and WebAssembly are required to run the interactive app.</strong></p>
        <h2>Supported Formats</h2>
        <ul>
          <li><strong>Read (12):</strong> JPEG, PNG/APNG, WebP, AVIF, JPEG XL, HEIC/HEIF, TIFF, GIF (first frame), BMP, ICO/CUR, QOI, SVG</li>
          <li><strong>Write (10):</strong> JPEG (MozJPEG), PNG (OxiPNG), WebP, AVIF, JPEG XL, GIF, TIFF, BMP, multi-size ICO, QOI</li>
        </ul>
        <h2>Key Features</h2>
        <ul>
          <li>Drop individual images, whole folders (preserving subfolders), or paste from clipboard.</li>
          <li>Resize by longest edge, max width, max height, fit-in-box, or percentage (never upscales unless requested).</li>
          <li>Batch rename templates with <code>{name}</code>, <code>{n}</code>, <code>{n:3}</code>, <code>{w}</code>, <code>{h}</code>, <code>{date}</code>, and <code>{fmt}</code>.</li>
          <li>Strips EXIF and GPS metadata from re-encoded images by default while applying EXIF orientation so phone photos stay upright. Non-JPEG originals kept because re-encoding would be larger are left byte-identical.</li>
          <li>Keeps the original file when re-encoding would make it larger.</li>
          <li>Built-in presets: Web (WebP 2048px), Compress (keep format), iPhone HEIC to JPEG, Smallest AVIF, and Multi-size Favicon (ICO).</li>
        </ul>
        <h2>Automation, Agents &amp; Documentation</h2>
        <ul>
          <li><a href="/llms.txt">LLM &amp; Agent Guide (llms.txt)</a> and <a href="/llms-full.txt">Complete Reference (llms-full.txt)</a></li>
          <li>URL link settings (for this visit only): <code>https://image.ruxera.com/?f=webp&amp;q=75&amp;long-edge=1600</code></li>
          <li>Browser scripting API: attach files to <code>input#jit-files</code> and evaluate <code>await window.justImageThings.run()</code></li>
          <li>Headless CLI (from repo): <code>bun run agent &lt;folder&gt; -f webp -q 75 --long-edge 2048 --json</code></li>
        </ul>
